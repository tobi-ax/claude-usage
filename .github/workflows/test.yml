name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.8 for the remote collector test
        run: uv python install 3.8
      - name: Run tests
        run: uvx pytest -rxs
        env:
          CLAUDE_USAGE_REQUIRE_PY38: "1"
